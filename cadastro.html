<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="icon" type="image/x-icon" href="LogoSenac.webp">
</head>
<body>
    <br><br><br><br><br>
    <img src="LogoSenac.webp" alt="logo senac" width="200px" height="200px"><br>
    <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="login.html">Login</a></li>
        <li><a href="produtos.html">Cursos</a></li>
        <li><a href="contato.html">Contato</a></li>
    </ul>
    <h2>Dados pessoais</h2>
    <fieldset>
        <legend><h3>Formulário de Cadastro</h3></legend>
        <label for="nome">Nome:</label>
        <input type="text" id="nome"><br><br>
        <label for="nascimento">Data de Nascimento:</label>
        <input type="date" id="nascimento"><br><br>
        <label for="cpf">CPF:</label>
        <input type="number" id="cpf">
        <label for="telefone">Telefone:</label>
        <input type="number" id="telefone">
        <label for="genero">Gênero:</label>
        <input type="radio"name="genero">Masculino
        <input type="radio"name="genero">Feminino
        <input type="radio"name="genero">Outro<br><br>
        <label for="estadocivil">Estado Civil:</label>
        <select id="estadocivil">
            <option value="solteiro">Solteiro(a)</option>
            <option value="casado">Casado(a)</option>
            <option value="divorciado">Divorciado(a)</option>
            <option value="viuvo">Viúvo(a)</option>
            <option value="outro">Outro</option>
        </select><br><br>
    </fieldset><br><br>
    <h2>Dados de acesso</h2>    
    <fieldset>
        <legend><h3>Informações de endereço</h3></legend>
        <label for="rua">Rua:</label>
        <input type="text"><br><br>
        <label for="number">Número:</label>
        <input type="number">
        <label for="bairro">Bairro:</label>
        <input type="text">
        <label for="cidade">Cidade:</label>
        <select>
            <option value="cidade">Curitiba</option>
            <option value="cidade">São Paulo</option>
            <option value="cidade">Rio de Janeiro</option>
            <option value="">CEP</option>
        </select>
    </fieldset>    
    <fieldset>
        <legend><h3>Dados de login</h3></legend>
        <label for="email">E-mail:</label>
        <input type="email" id="email"><br><br>
        <form>
            <label for="foto">Imagem de perfil:</label>
            <input type="file" id="foto"name="foto"accept="image/*">
        </form><br>
        <label for="senha">Senha:</label>
        <input type="password" id="senha">
        <label for="confirmar">Confirmar Senha:</label>
        <input type="password" id="confirmar">
    </fieldset>
    <fieldset>
        <legend><h3>Termos e condições</h3></legend>
        <input type="checkbox">
        <label for="termos"><a href="#">Aceito os termos e condições</a></label>
    </fieldset><br><br>
    <button type="button">Cadastrar</button>
    <br><br><br><br><br>
    <p>&copy; 2026 Senac. Todos os direitos reservados.</p>

    
</body>
</html>
