<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link rel="icon" type="image/x-icon" href="LogoSenac.webp">
</head>
<body>
    <br><br><br><br><br>
    <img src="LogoSenac.webp" alt="logo senac" width="200px" height="200px"><br>
    <h1>Entre em contato conosco</h1>
    <ul>
        <li><a href="index.html">Início</a></li>
    </ul>
    <fieldset>
        <legend><h3>Formulário de Contato</h3></legend>
        <label for="nome">Nome:</label>
        <input type="text" id="nome"><br><br>
        <label for="email">E-mail:</label>
        <input type="email" id="email"><br><br>
        <fieldset>
            <legend><h3>Escolha de cursos</h3></legend>
            <label for="curso">Selecione um curso:</label>  
            <select>
                <option value="curso1">Curso 1</option>
                <option value="curso2">Curso 2</option>
                <option value="curso3">Curso 3</option>
            </select><br><br>
            <label for="modalidade">Modalidade:</label>
            <input type="radio"name="modalidade">Presencial
            <input type="radio"name="modalidade">Online<br><br>
        </fieldset><br>
        <label for="vagas">Quantidade de vagas:</label>
        <input type="number"><br><br>
        <label for="mensagem">Mensagem de dúvidas:</label><br>
        <textarea id="mensagem" rows="5"></textarea><br><br>
        <button type="button"><a href="agradecimento.html">Enviar</a></button>
    </fieldset><br><br><br><br><br>
    <p>&copy; 2026 Senac. Todos os direitos reservados.
    </p>
    
</body>
</html>
